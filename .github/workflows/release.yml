name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            runner: macos-26
            architecture: arm64
            archive: PullDown-Apple-Silicon.zip
          - label: Intel
            runner: macos-26-intel
            architecture: x86_64
            archive: PullDown-Intel.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Show build tools
        run: xcodebuild -version

      - name: Build PullDown
        run: |
          xcodebuild \
            -project PullDown.xcodeproj \
            -scheme PullDown \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=${{ matrix.architecture }} \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Ad-hoc sign and package
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/PullDown.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v7
        with:
          name: PullDown-${{ matrix.architecture }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: PullDown-*
          path: release
          merge-multiple: true

      - name: Create checksums
        run: shasum -a 256 release/*.zip > release/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: build-${{ github.run_number }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --target "${{ github.sha }}" \
              --title "PullDown build ${{ github.run_number }}" \
              --notes "Native macOS 15+ builds for Apple Silicon and 64-bit Intel Macs. These builds are ad-hoc signed and are not notarised."
          fi
