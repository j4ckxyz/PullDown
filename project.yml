name: PullDown
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    macOS: "15.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 0.3.0
targets:
  PullDown:
    type: application
    platform: macOS
    sources:
      - Sources/PullDown
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.j4ck.PullDown
        PRODUCT_NAME: PullDown
        INFOPLIST_KEY_CFBundleDisplayName: PullDown
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
        INFOPLIST_KEY_SUPublicEDKey: "0+4+aMJztf+1K8h1yhVyuqlQVsNAzqFGStZwL8RPnFE="
        INFOPLIST_KEY_SUAutomaticallyUpdate: NO
        INFOPLIST_KEY_SUEnableAutomaticChecks: YES
        INFOPLIST_KEY_SUEnableInstallerLauncherService: YES
        INFOPLIST_KEY_SUFeedURL: "https://github.com/j4ckxyz/PullDown/releases/latest/download/appcast.xml"
        INFOPLIST_KEY_SURequireSignedFeed: YES
        INFOPLIST_KEY_SUVerifyUpdateBeforeExtraction: YES
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - PullDownTests
        - PullDownUITests
  PullDownTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PullDownTests
    dependencies:
      - target: PullDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.j4ck.PullDownTests
        SWIFT_STRICT_CONCURRENCY: complete
  PullDownUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: PullDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.j4ck.PullDownUITests
        TEST_TARGET_NAME: PullDown
        SWIFT_STRICT_CONCURRENCY: complete
